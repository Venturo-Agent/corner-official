<div class="app">
<header class="top"><b>導演台</b><select id="directorMode" aria-label="導演台模式" onchange="if(this.value==='handbook')location.href='../../handbooks/_masters/director/'"><option value="deck">簡報</option><option value="handbook">手冊</option></select>
  <button type="button" id="imp">開啟檔案</button><button type="button" class="pri" id="exp" title="下載可繼續編輯的檔案">下載編輯檔</button><button type="button" id="print" title="開啟列印視窗，選擇另存為 PDF">匯出 PDF</button><button type="button" id="undo" aria-keyshortcuts="Control+z Meta+z" class="history-button" aria-label="復原" title="復原 Ctrl／⌘ Z" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2)"/></svg></button><button type="button" id="redo" aria-keyshortcuts="Control+y Meta+Shift+z" class="history-button" aria-label="重做" title="重做 Ctrl Y／⌘ Shift Z" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14" transform="translate(0 -2)"/></svg></button><button type="button" id="reset" title="還原整份簡報的編輯">還原</button><span class="sep"></span><button type="button" id="layoutEditTog" aria-pressed="false">編輯</button><button type="button" class="pri" id="presentTog" aria-pressed="false">開始放映</button><button type="button" id="speakerTog">講者視窗 S</button><button type="button" id="overviewTog">縮圖總覽 O</button><button type="button" id="fsTog">全螢幕 F</button><button type="button" id="motionTog">收起頁面動畫</button>
  <span class="sp"></span><span class="sv" id="saveInfo">自動儲存於本機</span><span class="sep"></span>
</header>
<nav class="rail">
  <div class="blk"><b>投影片（<span id="pos"></span>）</b><div class="pages" id="pages"></div></div>
  <div class="row"><select id="addType" aria-label="頁型"></select><button type="button" class="pri" id="add">＋新增</button></div>
  <div class="row"><button type="button" id="del">刪除這頁</button></div>
</nav>
<aside class="insp">
  <div class="blk" id="pageSettings"><h2>版面</h2><div class="vars" id="vars"></div><div id="pageMotion" hidden></div><p id="capacityInfo" role="status" hidden>內容超出版面，請拆頁或換版</p></div>
  <div class="blk" id="addTools"><h2>快速動作</h2><div class="row"><button id="addCompany" type="button">公司名稱</button><button id="addText" type="button">＋文字</button><button id="addImage" type="button">＋圖片</button></div>
  <div class="row"><button id="copyElement" aria-keyshortcuts="Control+c Meta+c" type="button" title="複製 Ctrl／⌘ C">複製</button><button id="pasteElement" aria-keyshortcuts="Control+v Meta+v" type="button" title="貼上 Ctrl／⌘ V">貼上</button><button id="splitPage" type="button" disabled title="這頁不需要分頁">分頁</button></div>
  <input id="newImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <select hidden id="objectSelect" aria-label="新增的文字與圖片"><option value="">選擇新增物件</option></select>
  </div>
  <div class="blk" id="lineTools"><h2>線條</h2><div class="row"><select id="lineSelect" aria-label="選擇線條"></select><input id="lineColor" type="color" value="#1d6b63" aria-label="線條顏色"><input id="lineWidth" type="number" min="0.5" max="40" step="0.5" aria-label="線條粗細"><button id="lineReset" title="還原選取線條的顏色、粗細與顯示" type="button">還原</button><button id="lineDelete" title="移除選取線條；可用還原恢復" type="button">刪除</button></div></div>
  <div class="blk" id="photoSettings"><h2>圖片</h2>
    <div class="row" id="imgTools"><button type="button" id="editTog" aria-pressed="false">編輯</button><button type="button" id="imgPick" title="更換選取圖片" disabled>更換</button><button type="button" id="imgRst" title="還原選取圖片與取景" disabled>還原</button><button type="button" id="focusRst" title="將選取圖片的取景置中" disabled>置中</button></div>
    <p id="focusInfo"></p>
    <div class="row"><button type="button" id="pageRst" title="還原本頁文字、圖片與新增物件">還原這一頁</button></div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,application/json" hidden>
    </div>
  <div id="noticeSettings" class="blk" hidden><label><input id="noticeDetail" type="checkbox">顯示詳細內容</label></div>
  <div id="objectFields" hidden><h2 id="selectionTitle">文字</h2><label id="textLabel" for="objectText">文字</label><textarea id="objectText" rows="2"></textarea>
  <div id="textStyle"><label>字體<select id="objectFont"><option value="">原字體</option><option value="serif">明體</option><option value="sans">黑體</option><option value="mono">等寬</option></select></label><div class="row"><label>字級<input id="object-size" type="number" min="8" max="180"></label><label>字色<input id="objectColor" type="color"></label></div><div class="row text-toggles"><button id="objectBold" title="粗體" type="button" aria-label="粗體" aria-pressed="false"><b>B</b></button><button id="objectItalic" title="斜體" type="button" aria-label="斜體" aria-pressed="false"><i>I</i></button><button id="objectUnderline" title="底線" type="button" aria-label="底線" aria-pressed="false"><u>U</u></button></div></div><div id="objectImageTools" hidden class="row"><button id="objectImageReplace" type="button">更換</button><button id="objectImageCenter" type="button">置中</button></div><button id="deleteSelection" title="刪除選取物件 Delete" aria-keyshortcuts="Delete" type="button">刪除</button>
  </div>
  <div class="blk" id="arrangeTools" hidden><h2>排列</h2><div id="singleArrange" class="row"><button id="alignHorizontal" type="button" title="相對投影片水平置中">水平置中</button><button id="alignVertical" type="button" title="相對投影片垂直置中">垂直置中</button></div><div id="multiArrange" hidden><div class="row"><button data-align="left">靠左</button><button data-align="center">水平置中</button><button data-align="right">靠右</button></div><div class="row"><button data-align="top">靠上</button><button data-align="middle">垂直置中</button><button data-align="bottom">靠下</button></div><div class="row"><button data-distribute="horizontal">水平等距</button><button data-distribute="vertical">垂直等距</button></div></div><div class="row"><button id="layer-up" data-layer-order="up" type="button" disabled>上移一層</button><button id="layer-down" data-layer-order="down" type="button" disabled>下移一層</button></div><div class="row"><button id="layer-front" data-layer-order="front" type="button" disabled>置頂</button><button id="layer-back" data-layer-order="back" type="button" disabled>置底</button></div><p id="layerInfo" hidden></p></div>
    <p id="msg" role="status" aria-live="polite"></p>
</aside>
<main class="view"><div class="canvas-tools"><label class="snap-option"><input id="snapTog" type="checkbox" checked title="對齊與等距吸附；按住 Alt 暫時略過">磁吸</label><button type="button" id="guideTog" aria-pressed="true">智慧參考線</button></div><div id="stage"></div><div class="hint">← → 翻頁　·　點字編輯</div></main>
</div>

<script src="data.js?v=11121139"></script>
<script src="names.js?v=20261110-names"></script>
<script src="morph.js?v=20261110-names"></script>
<script src="core.js?v=20261110-names"></script>
<script src="pagination.js?v=20261109-motion-options"></script>
<script src="variants.bundle.js?v=20261110-morph6"></script>
<script src="talk.js?v=11121139"></script>
<script src="talk2.js?v=11121139"></script>
<script src="talk3.js?v=11121251"></script>
<script src="talk4.js?v=11121139"></script>
<script src="talk5.js?v=11121139"></script>
<script id="ai-talk-grays">Object.assign(M.paperInkGrays=M.paperInkGrays||{},{"img/cand-oia.jpg": "img/gray-cand-oia.jpg", "img/cand-banff.jpg": "img/gray-cand-banff.jpg", "img/jp-miyajima.jpg": "img/gray-jp-miyajima.jpg"})</script>
<script src="editor-clipboard.js?v=20261106-ux31"></script>
<script src="editor.js?v=20261106-ux31"></script>
<script>(function(){function fs(){var d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}}var b=document.getElementById("fsTog");if(b)b.onclick=fs;addEventListener("keydown",function(e){if((e.key==="f"||e.key==="F")&&!e.target.isContentEditable&&!e.target.closest("input,select,textarea"))fs()})})()</script>
<script>addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.classList.contains("present")&&/studio|edit/.test(location.search)&&!document.querySelector(".overview.open,[data-overview].open,.presenter-open")&&!(document.fullscreenElement))document.getElementById("presentTog").click()});(function(){var p=null,skip=0;addEventListener("click",function(e){if(skip&&Date.now()-skip<700){skip=0;e.stopImmediatePropagation();e.preventDefault()}},true);addEventListener("pointerdown",function(e){p=e.pointerType==="touch"&&document.body.classList.contains("present")&&!e.target.closest("button,a,input,label,select,textarea,[role=button],[role=slider],[role=checkbox]")?e:null});addEventListener("pointerup",function(e){if(!p||e.pointerId!==p.pointerId)return;var dx=e.clientX-p.clientX,dy=e.clientY-p.clientY;p=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){skip=Date.now();M.presentation.step(dx<0?1:-1)}else if(Math.hypot(dx,dy)<10&&!M.presentation.hit(e.clientX,e.clientY)){skip=Date.now();M.presentation.step(e.clientX>innerWidth/2?1:-1)}})})();M.start()</script>
<script>(()=>{const undo=document.getElementById('undo'),redo=document.getElementById('redo');const sync=()=>{undo.disabled=!M.history?.canUndo;redo.disabled=!M.history?.canRedo};document.getElementById('copyElement').onclick=()=>M.editor.copy();document.getElementById('pasteElement').onclick=()=>M.editor.paste();undo.onclick=()=>M.history?.undo();redo.onclick=()=>M.history?.redo();addEventListener('masters:history',sync);sync()})()</script>
<script>document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>M.editor.align(b.dataset.align));document.querySelectorAll('[data-distribute]').forEach(b=>b.onclick=()=>M.editor.distribute(b.dataset.distribute));document.querySelectorAll('[data-layer-order]').forEach(b=>b.onclick=()=>M.editor.layer(b.dataset.layerOrder));addEventListener('masters:selectionchange',e=>{const copy=document.getElementById('copyElement');copy.disabled=false;copy.title='複製 Ctrl／⌘ C';document.getElementById('singleArrange').hidden=e.detail.count>1;document.getElementById('multiArrange').hidden=e.detail.count<2;document.querySelectorAll('[data-distribute]').forEach(b=>b.disabled=!e.detail.canDistribute)})</script>
<script>if(!new URLSearchParams(location.search).has("studio"))M.presentation.present(true)</script>
</body>
</html>
