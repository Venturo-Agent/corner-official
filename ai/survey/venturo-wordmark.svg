<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1281 152" width="1281" height="152" role="img" aria-label="VENTURO">
<title>VENTURO</title>
<!--
  VENTURO 字標向量版（影片用）
  來源：workspace/2026-10-29-一棧電影級宣傳片/素材/logo-venturo-原圖.jpg（1280x152）。
  做法：2026-10-29 晚以程式量測邊緣、最小平方法擬合直線與圓弧後重建；不是設計師原檔，官方向量檔找到後以原檔為準。
  座標＝原圖像素座標（可直接疊回原圖比對）。顏色為原圖量測值，官方色票待確認：
    墨色 #231F1E（接近印刷 K100 常見的 #231F20）  藍色 #1E75BD
  結構：每個字母一個 <g id="letter-X">，每段筆畫一個 <path>，共 14 段；藍色兩段 id 為 E-accent、O-accent。
    改色用 class：.ink（墨色）、.accent（藍色）；深色底請把 .ink 改成白色。
  量到的設計規則：直筆寬約 20（19.8–20.9）、E 橫筆 17.9、切口寬約 16.4–17.7；
    O 外半徑 75.67、內半徑 54.95、圓心 (1204.41, 75.76)，沿 45 度斜線切成上左黑、下右藍兩半。
-->
<g id="venturo-logo">
  <g id="letter-V">
    <path id="V-1" class="ink" fill="#231F1E" d="M 0.05 4.19 L 23.51 4.19 L 83.14 147.19 L 59.68 147.19 Z"/>
    <path id="V-2" class="ink" fill="#231F1E" d="M 120.83 4.19 L 144.30 4.19 L 92.30 124.07 L 80.80 96.49 Z"/>
  </g>
