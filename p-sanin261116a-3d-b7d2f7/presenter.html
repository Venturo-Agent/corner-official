<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>主講人畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
<style>
  /* 主講人畫面（在大螢幕按 P 開）：只給主講人看，暗底省眼、字大；大螢幕那邊的資料由 hud.js 送過來，這頁不載 data.js */
  :root { --ink:#1b1714; --ink2:#262019; --paper:#f3ebdc; --mute:#a99c88; --red:#c8463a; --line:rgba(243,235,220,.14);
    --serif:"Noto Serif CJK TC","Noto Serif TC",serif; --sans:"Noto Sans TC",sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--ink); color:var(--paper); font-family:var(--sans); overflow:hidden; }
  body { display:grid; grid-template-rows:auto 1fr auto; }
  header { display:flex; align-items:center; gap:1.4em; padding:16px 28px; border-bottom:1px solid var(--line); }
  header .ttl { font:600 18px/1.2 var(--serif); letter-spacing:.12em; }
  header .cl { font:500 13px/1 var(--sans); color:var(--mute); letter-spacing:.1em; }
  header .link { margin-left:auto; font:600 12px/1 var(--sans); letter-spacing:.2em; color:var(--mute); display:flex; align-items:center; gap:.6em; }
  header .link i { width:8px; height:8px; border-radius:50%; background:#6b5f50; }
  header .link.on i { background:#7fb069; }
  header .clock { font:600 20px/1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:.06em; }
  main { display:grid; grid-template-columns:1fr minmax(300px, 34%); min-height:0; }
  .now { padding:28px 36px; overflow:auto; border-right:1px solid var(--line); }
  .k { font:700 12px/1 var(--sans); letter-spacing:.36em; color:var(--red); }
  .now .pos { display:flex; align-items:baseline; gap:1em; margin-bottom:10px; }
  .now .pos b { font:600 13px/1 var(--sans); letter-spacing:.2em; color:var(--mute); font-variant-numeric:tabular-nums; }
  .now h1 { font:700 clamp(26px,3.4vw,40px)/1.35 var(--serif); letter-spacing:.06em; margin:4px 0 22px; }
  .now .src { font:600 12px/1 var(--sans); letter-spacing:.24em; color:var(--mute); margin-bottom:12px; }
  .now ul { list-style:none; }
  .now li { font:500 clamp(18px,1.9vw,24px)/1.65 var(--serif); padding:.45em 0 .45em 1.3em; border-top:1px solid var(--line); position:relative; }
  .now li::before { content:""; position:absolute; left:0; top:1.05em; width:7px; height:7px; rotate:45deg; border:1.5px solid var(--red); }
  .now .empty { color:var(--mute); font:500 16px/1.6 var(--sans); }
  aside { display:flex; flex-direction:column; gap:22px; padding:28px 28px; min-height:0; }
  .next { padding:18px 20px; background:var(--ink2); border:1px solid var(--line); border-radius:3px; }
  .next p { margin-top:12px; font:600 clamp(18px,1.7vw,22px)/1.5 var(--serif); }
  .timers { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .timers div { padding:14px 16px; border:1px solid var(--line); border-radius:3px; }
  .timers b { display:block; margin-top:10px; font:700 clamp(30px,3.2vw,44px)/1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .timers button { margin-top:10px; font:600 11px/1 var(--sans); letter-spacing:.2em; color:var(--mute); background:none; border:1px solid var(--line); padding:.5em .8em; cursor:pointer; border-radius:2px; }
  .ctl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ctl button { padding:16px 10px; font:600 16px/1 var(--serif); letter-spacing:.2em; color:var(--paper); background:var(--ink2); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
  .ctl button small { display:block; margin-top:8px; font:600 10px/1 var(--sans); letter-spacing:.24em; color:var(--mute); }
  .ctl button.go { background:var(--red); border-color:var(--red); grid-column:1 / -1; }
  .ctl button.go small { color:rgba(243,235,220,.75); }
  .ctl button.dark { grid-column:1 / -1; }
  .ctl button.dark.on { background:var(--paper); color:var(--ink); }
  .ctl button:disabled { opacity:.3; cursor:not-allowed; }
  footer { padding:12px 28px; border-top:1px solid var(--line); font:500 12px/1.6 var(--sans); color:var(--mute); letter-spacing:.08em; }
  footer b { color:var(--paper); font-weight:600; margin:0 .3em; }
  body.dark header { box-shadow:inset 0 -3px 0 var(--paper); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } .now { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><span class="ttl" id="ttl">主講人畫面</span><span class="cl" id="cl"></span>
  <span class="link" id="link"><i></i><span>等待大螢幕</span></span><span class="clock" id="clock">--:--</span></header>
<main>
  <section class="now">
    <div class="pos"><span class="k">NOW　目前這幕</span><b id="pos"></b></div>
    <h1 id="cur">—</h1>
    <p class="src" id="src"></p>
    <ul id="notes"></ul>
  </section>
  <aside>
    <div class="next"><span class="k">NEXT　下一幕</span><p id="next">—</p></div>
    <div class="timers">
      <div><span class="k">TOTAL　總時間</span><b id="tTotal">00:00</b><button type="button" id="reset">歸零</button></div>
      <div><span class="k">SCENE　本幕</span><b id="tScene">00:00</b></div>
    </div>
    <div class="ctl">
      <button type="button" class="go" data-key="ArrowRight">下一步<small>→　空白　PAGE DOWN</small></button>
      <button type="button" data-key="ArrowLeft" id="prev">上一步<small>←　PAGE UP</small></button>
      <button type="button" data-key="Escape" id="esc">主選單<small>ESC</small></button>
      <button type="button" class="dark" data-key="b" id="dark">黑屏<small>B</small></button>
    </div>
  </aside>
</main>
<footer>簡報筆：<b>下一頁</b>＝下一步、<b>黑屏鍵</b>＝黑屏切換。開始旅程之後只能往前（大螢幕同規則）。講稿讀故事檔 story.notes［場景名，逐日用 day:3、關卡用 chapter:2］，沒寫就列這幕資料裡的重點。</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const BCH = 'BroadcastChannel' in window ? new BroadcastChannel('journey-presenter') : null;
  let n = 0, st = null, lastAt = 0, t0 = Date.now();
  const send = (m) => { m.src = 'presenter'; m.id = `${Date.now()}-${Math.random().toString(36).slice(2)}-${n++}`;
    if (BCH) BCH.postMessage(m); if (window.opener && !window.opener.closed) window.opener.postMessage(m, '*'); };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  function show(m) {
    st = m; lastAt = Date.now();
    $('ttl').textContent = m.title || '主講人畫面'; $('cl').textContent = m.client || '';
    $('pos').textContent = m.run && m.step >= 0 ? `${String(m.step + 1).padStart(2, '0')} / ${m.total}` : '';
    $('cur').textContent = (m.cur && m.cur.label) || '—';
    const ns = (m.cur && m.cur.notes) || [];
    $('src').textContent = ns.length ? (m.cur.own ? '講稿' : '重點（從這幕資料整理，沒有講稿）') : '';
    $('notes').innerHTML = ns.length ? ns.map((x) => `<li>${esc(x)}</li>`).join('') : '<li class="empty">這幕沒有文字資料</li>';
    $('next').textContent = (m.next && m.next.label) || (m.run ? '最後一幕' : '—');
    $('dark').classList.toggle('on', !!m.dark); document.body.classList.toggle('dark', !!m.dark);
    $('prev').disabled = !!m.run; $('esc').disabled = !!m.run || ['load', 'teaser', 'boot', 'menu'].includes(m.state);
  }
  function onMsg(m) { if (m && m.src === 'deck' && m.t === 'state') show(m); }
  if (BCH) BCH.onmessage = (e) => onMsg(e.data);
  addEventListener('message', (e) => onMsg(e.data));
  const KEYS = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'PageDown', 'PageUp', 'Enter', 'Escape', 'Backspace', 'b', 'B', '.'];
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') { t0 = Date.now(); return; }
    if (KEYS.includes(e.key)) { e.preventDefault(); send({ t: 'key', key: e.key }); }
  });
  document.querySelectorAll('.ctl button').forEach((b) => b.addEventListener('click', () => send({ t: 'key', key: b.dataset.key })));
  $('reset').onclick = () => { t0 = Date.now(); };
  setInterval(() => {
    const d = new Date(); $('clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    $('tTotal').textContent = mmss(Date.now() - t0); $('tScene').textContent = st ? mmss(Date.now() - st.sceneAt) : '00:00';
    $('link').classList.toggle('on', !!st);
    $('link').querySelector('span').textContent = st ? '已連線大螢幕' : '等待大螢幕…';
    if (!st) send({ t: 'hello' });
  }, 500);
  send({ t: 'hello' });
})();
</script>
</body>
</html>
