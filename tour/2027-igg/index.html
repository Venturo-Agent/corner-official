<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<base href="/tour/2027-igg/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投影母片</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* 投影母片外殼：左邊編輯面板（整份頁序、這頁的版本、項目數、新增／刪除投影片），右邊 1920×1080 頁面 */
:root{--ink:#1d2124;--mute:#6b7176;--line:#d9dcd8;--panel:#f4f2ee;--acc:#1d6b63;--acc2:#b3372b;--acc3:#c9921c;--paper:#fbfaf7;
--serif:"Noto Serif TC","Noto Serif CJK TC",serif;--sans:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2d2f;font-family:var(--sans);color:var(--ink)}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
.side{background:var(--panel);overflow-y:auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:16px}
.side h1{font:700 18px var(--serif);margin:0}.side p{margin:0;font-size:13px;line-height:1.7;color:var(--mute)}
.side a{color:var(--acc);font-size:13px}
.blk{display:grid;gap:7px}.blk>b{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.pages{display:grid;gap:3px;max-height:34vh;overflow-y:auto;padding-right:4px}
.pages button,.vars button{all:unset;cursor:pointer;display:block;padding:7px 10px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.35}
.pages i{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:8px}
.pages small,.vars small{display:block;color:var(--mute);font-size:12px}
.pages button[aria-current="true"],.vars button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.vars{display:grid;gap:5px}.vars button[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button,.row select{font:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.row .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.cnt output{font:700 22px var(--serif);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.view{position:relative;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--paper);overflow:hidden}
.slide{position:absolute;inset:0;overflow:hidden}
.slide [contenteditable]{outline:none;border-radius:4px}.slide [contenteditable]:hover{box-shadow:0 0 0 2px #1d6b6355}.slide [contenteditable]:focus{box-shadow:0 0 0 3px #1d6b63aa}
.ab{position:absolute}.serif{font-family:var(--serif);font-weight:700}
.kick{font:600 24px var(--serif);letter-spacing:.14em;color:var(--acc)}
.five{display:flex}.five i{display:block;width:34px;height:6px}
.five i:nth-child(1){background:var(--acc)}.five i:nth-child(2){background:var(--acc2)}.five i:nth-child(3){background:var(--acc3)}.five i:nth-child(4){background:#fff;box-shadow:inset 0 0 0 1px #c9cdd0}.five i:nth-child(5){background:var(--ink)}
.in{animation:in .7s cubic-bezier(.16,.8,.24,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
.present .app{display:block}.present .side,.present .hint{display:none}.present .view{width:100%;height:100%}
.present .slide [contenteditable=false]:hover{box-shadow:none}
.edit .slide img{cursor:grab;outline:3px dashed #c9921caa;outline-offset:-3px}.edit .slide img:active{cursor:grabbing}
#msg{min-height:1.5em}#msg[data-bad="1"]{color:#b3372b;font-weight:700}
.row button:disabled{opacity:.4;cursor:not-allowed}
.hint{position:absolute;right:16px;bottom:10px;color:#ffffff99;font-size:12px}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:50vh}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <a href="../">← 回總入口</a>
  <a href="?continuity=1&page=0">播放照片延續版本</a>
  <a href="?storyboard=1&page=0">播放逐頁分鏡版本</a>
  <div><h1>投影母片</h1><p>ERP 資料一進來就排好整份。每一頁可以點一下換版本、直接點字修改、加減項目；航線聚焦可切換一路拉近、全景切近或分日照片路線；版面都是程式照規則算的，不靠 AI。</p></div>
  <div class="row"><button type="button" id="presentTog" aria-pressed="false">開始放映</button><button type="button" id="motionTog">收起頁面動畫</button></div>
  <div class="row"><button type="button" id="speakerTog">講者視窗 S</button><button type="button" id="overviewTog">縮圖總覽 O</button><button type="button" id="fsTog">全螢幕 F</button></div>
  <div class="blk"><b>整份頁序（<span id="pos"></span>）</b><div class="pages" id="pages"></div></div>
  <div class="blk"><b>這一頁的版本</b><div class="vars" id="vars"></div></div>
  <div class="blk" id="cntBlk"><b id="cntLab">項目數</b><div class="row cnt"><button type="button" id="minus" aria-label="減少一項">−</button><output id="n"></output><button type="button" id="plus" aria-label="增加一項">＋</button></div><p>變灰的版本＝這個數量排不下。</p></div>
  <div class="blk"><b>新增投影片（插在這頁後面）</b><div class="row"><select id="addType" aria-label="頁型"></select><button type="button" class="pri" id="add">新增</button><button type="button" id="del">刪除這頁</button></div></div>
  <div class="blk"><b>全編輯模式</b>
    <div class="row"><button type="button" class="pri" id="editTog" aria-pressed="false">開始編輯照片</button></div>
    <div class="row" id="imgTools" hidden><button type="button" id="imgPick">換這張圖…</button><button type="button" id="imgRst">還原這張</button><button type="button" id="focusRst">焦點置中</button></div>
    <p id="focusInfo"></p>
    <div class="row"><button type="button" id="pageRst">還原這一頁</button><button type="button" id="exp">匯出 JSON</button><button type="button" id="imp">匯入 JSON</button></div>
    <p id="msg" role="status"></p><input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,application/json" hidden>
    <p>文字隨時可以直接點了改。照片需先按「開始編輯照片」。換上去的圖會自動縮小，只存在這台瀏覽器。</p></div>
  <div class="blk"><div class="row"><button type="button" id="reset">回到原始資料</button></div><p>資料：韓國跨境交流五日（SEL261216A），照片是這團的真照片。改過的內容只存在這台瀏覽器。</p></div>
</aside>
<main class="view"><div id="stage"></div><div class="hint">翻頁 ← →　·　點字修改　·　目錄／總覽點一格＝跳到那頁</div></main>
</div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="variants.bundle.js"></script>
<script>(function(){function fs(){var d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}}var b=document.getElementById("fsTog");if(b)b.onclick=fs;addEventListener("keydown",function(e){if((e.key==="f"||e.key==="F")&&!e.target.isContentEditable&&!e.target.closest("input,select,textarea"))fs()})})()</script>
<script>M.start()</script>
</body>
</html>
